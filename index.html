<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASEAN pedia</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        .title{
            font-family: 'Times New Roman', Times, serif;
            font-size: 50px;
            margin-top: 40px; 
            margin-left: auto;
            line-height: 0%;
        }
        .sub-title{
            font-size: 25px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin-top: 0%; 
            margin-left: auto;
        }
        .flags{
            margin-left: auto;
        }
        .thailand{
            height: 100px;
            width: 100px;
            margin-right: 0%;
        }
        .placeholder{
            height: 100px;
            width: 100px;
        }
        .row1-flags{
            margin-top: 50px;
        }
        .row2-flags{
            margin-top: 25px;
        }
        .row3-flags{
            margin-top: 25px;
        }
        .theme-bth{
            position: absolute;
            top: 10px;
            right: 50px;
        }
        .dark-theme {
            background-color: #000000;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <button class="theme-bth" onclick="toggleTheme()">Toggle Theme</button>
    <div class="row title">
        <p> ASEAN Wikipedia <p>
    </div>
    <div class="row sub-title">
         <p>The free ASEAN encyclopedia</p>
    </div>
    <div class="row row1-flags">
        <div class="col placeholder0">
            <h1>THAILAND</h1>
            <img src="Flag_of_Thailand.svg" alt="Flag_of_Thailand" width="250px" height="150px">
        </div> 
        <div class="col placeholder">
            <h1>CAMBODIA</h1>
            <img src="Flag_of_Cambodia.svg" alt="Flag_of_Cambodia" width="250px" height="150px">
        </div>
        <div class="col placeholder2">
            <h1>VIETNAM</h1>
            <img src="Flag_of_Vietnam.svg.webp" alt="Flag_of_Vietnam" width="250px" height="150px">
        </div>
        <div class="col placeholder3">
            <h1>MYANMAR</h1>
            <img src="Flag_of_Myanmar.svg" alt="Flag_of_Myanmar" width="250px" height="150px">
        </div>
        <div class="col placeholder4">
            <h1>SINGAPORE</h1>
            <img src="Flag_of_Singapore.svg.webp" alt="Flag_of_Singapore" width="250px" height="150px">
        </div>
    </div>
    <div class="row row2-flags">
        <div class="col placeholder0">
            <h1>PHILIPPINES</h1>
            <img src="Flag_of_the_Philippines.svg.webp" alt="Flag_of_the_Philippines" width="250px" height="150px">
        </div> 
        <div class="col placeholder">
         <h1>MALAYSIA</h1>
            <img src="Flag_of_Malaysia.svg.webp" alt="Flag_of_Malaysia" width="250px" height="150px">
        </div>
        <div class="col placeholder2">
            <h1>INDONESIA</h1>
            <img src="Flag_of_Indonesia.svg.webp" alt="Flag_of_Indonesia" width="250px" height="150px">
        </div>
        <div class="col placeholder3">
            <h1>BRUNEI</h1>
            <img src="Flag_of_Brunei.svg.webp" alt="Flag_of_Brunei" width="250px" height="150px">
        </div>
        <div class="col placeholder4">
            <h1>LAOS</h1>
            <img src="Flag_of_Laos.svg.webp" alt="Flag_of_Laos" width="250px" height="150px">
        </div>
    </div>
    <div class="row row3-flags">
        <div class="col placeholder0">
            <h1>EAST TIMOR</h1>
            <img src="Flag_of_East_Timor.svg" alt="Flag_of_East_Timor" width="250px" height="150px">
        </div>




    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
        }
    </script>
</body>
</html>
